<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="382899224834-avf2jvlger4i48so8ja41eeie60o2m7v.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="renth_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Welcome to Renth</title>
  <link rel="manifest" href="manifest.json">

  <!-- Default Web Splash Screen Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
    }
    .splash-logo {
      width: 120px;
      max-width: 40vw;
      height: auto;
      margin-bottom: 20px;
    }
    .splash-title {
      font-size: 26px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 24px;
    }
    .splash-spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #000000;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    @keyframes splash-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- HTML & CSS Default Splash Screen (Renders immediately when URL is hit) -->
  <div id="loading-splash">
    <img src="assets/assets/images/logo.png" alt="Renth Logo" class="splash-logo">
  </div>

  <script>
    function removeSplashScreen() {
      const splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.4s ease';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    // MutationObserver fallback to remove splash screen as soon as Flutter attaches to DOM
    const observer = new MutationObserver(function(mutations) {
      for (let mutation of mutations) {
        for (let node of mutation.addedNodes) {
          if (node.nodeName === 'FLUTTER-VIEW' || node.className === 'flt-glass-pane') {
            removeSplashScreen();
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        removeSplashScreen();
      }
    });
  </script>
</body>
</html>
